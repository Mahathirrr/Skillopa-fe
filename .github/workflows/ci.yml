name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: VITE_API_URL= npm run build

  e2e-prod-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Wait for production ready
        run: |
          for attempt in $(seq 1 36); do
            if curl -sf --max-time 8 https://skillopa.showcaseproject.my.id/ready >/dev/null; then
              echo "prod ready"
              exit 0
            fi
            echo "waiting for prod ($attempt/36)..."
            sleep 10
          done
          echo "prod not ready after 6 minutes" >&2
          exit 1
      - name: Install poppler (pdftoppm untuk banding PDF sertifikat)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Auth & OAuth (prod)
        run: |
          export PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id
          for attempt in 1 2 3; do
            npx playwright test e2e/auth.spec.ts e2e/google-oauth.spec.ts e2e/oauth-callback.spec.ts e2e/forgot-password.spec.ts e2e/legal-pages.spec.ts --reporter=line && exit 0
            echo "auth e2e attempt $attempt failed, retry..."
            sleep 25
          done
          exit 1
      - name: Reviews read-only UI (prod)
        run: |
          export PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id
          npx playwright test e2e/reviews-ui.spec.ts --grep "lists reviews" --reporter=line || npx playwright test e2e/reviews-ui.spec.ts --reporter=line
      - name: Profil instruktur (prod)
        run: |
          export PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id
          export E2E_FREE_COURSE_SLUG=belajar-web-pzn-gratis
          export E2E_INSTRUCTOR_SLUG=muhammad-mahathir-s-kom
          for attempt in 1 2 3; do
            npx playwright test e2e/instructor-public.spec.ts --reporter=line && exit 0
            echo "instructor e2e attempt $attempt failed, retry..."
            sleep 25
          done
          exit 1
      - name: Sertifikat PDF vs web (prod)
        run: |
          export PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id
          for attempt in 1 2 3; do
            npx playwright test e2e/certificate-download.spec.ts e2e/certificate-share.spec.ts --reporter=line && exit 0
            echo "certificate e2e attempt $attempt failed, retry..."
            sleep 25
          done
          exit 1
      - name: billing smoke (retry network)
        run: |
          for attempt in 1 2 3 4 5; do
            node e2e/prod-billing-sandbox-api.mjs && exit 0
            echo "attempt $attempt failed, retry..."
            sleep 20
          done
          exit 1
