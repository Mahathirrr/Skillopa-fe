name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: VITE_API_URL= npm run build

  e2e-prod-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: billing smoke (retry network)
        run: |
          for attempt in 1 2 3 4 5; do
            node e2e/prod-billing-sandbox-api.mjs && exit 0
            echo "attempt $attempt failed, retry..."
            sleep 20
          done
          exit 1
