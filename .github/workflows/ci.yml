name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: VITE_API_URL= npm run build

  e2e-prod-smoke:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Install poppler (pdftoppm untuk banding PDF sertifikat)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Auth & OAuth (prod)
        run: PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id npx playwright test e2e/auth.spec.ts e2e/google-oauth.spec.ts e2e/oauth-callback.spec.ts e2e/forgot-password.spec.ts e2e/legal-pages.spec.ts --reporter=line
      - name: Reviews API (prod)
        run: PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id E2E_FREE_COURSE_SLUG=belajar-web-pzn-gratis npx playwright test e2e/reviews.spec.ts e2e/reviews-ui.spec.ts e2e/admin-reviews-api.spec.ts --reporter=line
      - name: Profil instruktur (prod)
        run: PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id E2E_FREE_COURSE_SLUG=belajar-web-pzn-gratis E2E_INSTRUCTOR_SLUG=muhammad-mahathir-s-kom npx playwright test e2e/instructor-public.spec.ts --reporter=line
      - name: Sertifikat PDF vs web (prod)
        run: PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id npx playwright test e2e/certificate-download.spec.ts e2e/certificate-share.spec.ts --reporter=line
      - name: billing smoke (retry network)
        run: |
          for attempt in 1 2 3 4 5; do
            node e2e/prod-billing-sandbox-api.mjs && exit 0
            echo "attempt $attempt failed, retry..."
            sleep 20
          done
          exit 1
