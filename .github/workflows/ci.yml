name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: VITE_API_URL= npm run build
      - run: npx playwright install chromium --with-deps
      - run: PLAYWRIGHT_BASE_URL=https://skillopa.showcaseproject.my.id npm run test:e2e
